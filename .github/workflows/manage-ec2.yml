name: EC2 Start/Stop 

on:
  workflow_dispatch:

jobs:
  manage-ec2:
    runs-on: ubuntu-latest

    steps:
      # AWS 자격증명
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 🔐 GitHub Actions 러너 공인 IP 조회
      - name: Get Runner Public IP
        id: runner_ip
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "Runner IP: $RUNNER_IP"

      # 🔐 보안 그룹에 SSH 임시 허용
      - name: Allow SSH from GitHub Runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr $RUNNER_IP/32

      # EC2 시작
      - name: Start EC2
        run: |
          INSTANCE_ID=${{ secrets.INSTANCE_ID }}
          echo "Starting EC2 instance $INSTANCE_ID..."
          aws ec2 start-instances --instance-ids $INSTANCE_ID
          aws ec2 wait instance-running --instance-ids $INSTANCE_ID
          echo "EC2 is running."

      # EC2 Public IP 가져오기
      - name: Get EC2 Public IP
        run: |
          INSTANCE_ID=${{ secrets.INSTANCE_ID }}
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV
          echo "EC2 Public IP: $PUBLIC_IP"

      # Discord 웹훅 알림
      - name: Send Discord Webhook
        run: |
          MESSAGE="🚀 EC2 is running!\n\n🌐 Public IP: $PUBLIC_IP\n\n💻 SSH 접속:\nssh -i key.pem ubuntu@$PUBLIC_IP"
          curl -H "Content-Type: application/json" \
               -d "{\"content\":\"$MESSAGE\"}" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      # SSH 접속 → Docker / Nginx 실행
      - name: Start Docker & Nginx on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_PEM }}
          port: 22
          script: |
            echo "Starting service..."
            sudo systemctl start ballog-app.service
            sudo systemctl restart nginx
            echo "✅ Service started."

      # 대기 (60분)
      - name: Wait
        run: sleep 3600

      # EC2 중지
      - name: Stop EC2
        run: |
          INSTANCE_ID=${{ secrets.INSTANCE_ID }}
          aws ec2 stop-instances --instance-ids $INSTANCE_ID
          aws ec2 wait instance-stopped --instance-ids $INSTANCE_ID
          echo "EC2 stopped."

      # 🔐 보안 그룹 SSH 규칙 제거 (무조건 실행)
      - name: Revoke SSH from GitHub Runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr $RUNNER_IP/32
